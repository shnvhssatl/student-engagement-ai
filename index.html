
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Student Head Direction AI</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: #eef3f8;
  padding: 12px;
}

h2 {
  color: #123b61;
}

.card {
  background: white;
  padding: 15px;
  margin: 12px auto;
  max-width: 450px;
  border-radius: 12px;
}

video {
  width: 100%;
  border-radius: 10px;
  transform: scaleX(-1);
  background: black;
}

button {
  padding: 14px;
  width: 90%;
  margin: 8px;
  border: none;
  border-radius: 8px;
  background: #1769aa;
  color: white;
  font-size: 17px;
}

#status {
  font-size: 22px;
  font-weight: bold;
  color: #1769aa;
}

#details {
  color: #555;
  font-size: 14px;
}
</style>
</head>

<body>

<h2>SMART STUDENT ENGAGEMENT</h2>
<p>Mobile AI Camera Monitoring</p>

<div class="card">
  <video id="video" autoplay playsinline muted></video>

  <button id="startButton">START CAMERA AI</button>
  <button id="stopButton">STOP CAMERA</button>
</div>

<div class="card">
  <h3>AI Detection Result</h3>
  <p id="status">WAITING</p>
  <p id="details">Press Start Camera AI</p>
</div>

<script type="module">

import {
  FaceLandmarker,
  FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs";

const video = document.getElementById("video");
const statusText = document.getElementById("status");
const details = document.getElementById("details");

const startButton = document.getElementById("startButton");
const stopButton = document.getElementById("stopButton");

let cameraStream = null;
let faceLandmarker = null;
let running = false;
let lastVideoTime = -1;

async function startAI() {

  try {

    statusText.innerText = "LOADING AI";
    details.innerText = "Please wait...";

    // Load AI library and model
    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/wasm"
    );

    faceLandmarker =
      await FaceLandmarker.createFromOptions(
        vision,
        {
          baseOptions: {
            modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
            delegate: "CPU"
          },

          runningMode: "VIDEO",
          numFaces: 1
        }
      );

    // Request front camera
    cameraStream =
      await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "user",
          width: { ideal: 640 },
          height: { ideal: 480 }
        },
        audio: false
      });

    video.srcObject = cameraStream;

    await video.play();

    running = true;

    statusText.innerText = "CAMERA ACTIVE";
    details.innerText = "Looking for one face";

    lastVideoTime = -1;

    detectFrame();

  } catch (error) {

    statusText.innerText = "CAMERA ERROR";

    details.innerText =
      error.name + ": " + error.message;

    console.error(error);
  }
}

function detectFrame() {

  if (!running) return;

  if (video.readyState >= 2 &&
      video.currentTime !== lastVideoTime) {

    lastVideoTime = video.currentTime;

    const result =
      faceLandmarker.detectForVideo(
        video,
        performance.now()
      );

    if (result.faceLandmarks.length > 0) {

      const face = result.faceLandmarks[0];

      // Nose and eye landmark positions
      const nose = face[1];
      const leftEye = face[33];
      const rightEye = face[263];

      const eyeMiddle =
        (leftEye.x + rightEye.x) / 2;

      const eyeDistance =
        Math.abs(rightEye.x - leftEye.x);

      const difference =
        (nose.x - eyeMiddle) / eyeDistance;

      if (difference > 0.18) {

        statusText.innerText = "HEAD TURNED";

        details.innerText =
          "Head direction: RIGHT";

      }
      else if (difference < -0.18) {

        statusText.innerText = "HEAD TURNED";

        details.innerText =
          "Head direction: LEFT";

      }
      else {

        statusText.innerText =
          "FACING FORWARD";

        details.innerText =
          "Face is approximately forward";
      }

    } else {

      statusText.innerText = "NO FACE DETECTED";

      details.innerText =
        "Please position one face in front of camera";
    }
  }

  requestAnimationFrame(detectFrame);
}

function stopAI() {

  running = false;

  if (cameraStream) {

    cameraStream.getTracks().forEach(
      track => track.stop()
    );

    cameraStream = null;
  }

  video.srcObject = null;

  statusText.innerText = "CAMERA STOPPED";
  details.innerText = "Press Start to test again";
}

startButton.addEventListener("click", startAI);
stopButton.addEventListener("click", stopAI);

</script>

</body>
</html>
