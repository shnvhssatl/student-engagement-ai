
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Student Engagement Recovery</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #edf3f9;
  text-align: center;
  margin: 0;
  padding: 15px;
  color: #183047;
}

.card {
  background: white;
  padding: 18px;
  margin: 14px auto;
  border-radius: 15px;
  max-width: 440px;
  box-shadow: 0 3px 12px #0001;
}

button {
  padding: 13px;
  margin: 5px;
  width: 90%;
  border: none;
  border-radius: 9px;
  background: #1769aa;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

.answer {
  width: 43%;
  background: #e4efff;
  color: #183047;
  border: 2px solid #b7cce8;
  font-weight: bold;
}

.answer.selected {
  background: #1769aa;
  color: white;
}

#video {
  width: 100%;
  max-width: 360px;
  border-radius: 12px;
  transform: scaleX(-1);
}

#quizBox {
  display: none;
}

#message {
  font-weight: bold;
  color: #1769aa;
  padding: 10px;
}
</style>
</head>

<body>

<h2>Smart Student Engagement</h2>
<p>AI-Powered Recovery System</p>

<div class="card">

<h3>Bluetooth Connection</h3>
<p id="bleStatus">Not connected</p>

<button onclick="connectESP32()">
CONNECT ESP32
</button>

</div>

<div class="card">

<h3>Student AI Camera</h3>

<video id="video" autoplay playsinline muted></video>

<p id="direction">Direction: WAITING</p>

<button onclick="startCamera()">
START CAMERA AI
</button>

<button onclick="stopCamera()">
STOP CAMERA
</button>

</div>

<div class="card">

<h3>Student Performance</h3>

<h2 id="score">Score: 70</h2>

<p id="engagement">Status: WAITING</p>

<p id="quizCount">Quiz count: 0</p>

</div>

<div class="card" id="quizBox">

<h2>Recovery Quiz</h2>

<p id="questionNumber">Question 1</p>

<h3 id="question">What is 2 × 10?</h3>

<button class="answer" onclick="selectAnswer('A')">
A. 10
</button>

<button class="answer" onclick="selectAnswer('B')">
B. 20
</button>

<button class="answer" onclick="selectAnswer('C')">
C. 30
</button>

<button class="answer" onclick="selectAnswer('D')">
D. 40
</button>

<p id="message">Select your answer</p>

<button onclick="submitAnswer()">
SUBMIT ANSWER
</button>

</div>

<script type="module">

import {
  FaceLandmarker,
  FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs";

const SERVICE_UUID =
"12345678-1234-1234-1234-123456789000";

const CHARACTERISTIC_UUID =
"12345678-1234-1234-1234-123456789001";

let device;
let characteristic;
let faceLandmarker;
let cameraStream;
let cameraRunning = false;

let selectedAnswer = "";
let quizActive = false;
let score = 70;
let quizCount = 0;

let lastDirection = "";
let lastSentDirection = "";
let lastSendTime = 0;
let lastVideoTime = -1;

let pendingWrite = Promise.resolve();

const video = document.getElementById("video");

const questions = [
  {
    question: "What is 2 x 10?",
    options: ["10", "20", "30", "40"],
    correct: "B"
  },
  {
    question: "What is 5 + 7?",
    options: ["10", "11", "12", "13"],
    correct: "C"
  },
  {
    question: "What is 9 x 3?",
    options: ["18", "21", "27", "30"],
    correct: "C"
  },
  {
    question: "What is 20 / 4?",
    options: ["4", "5", "6", "8"],
    correct: "B"
  },
  {
    question: "Which planet is our home?",
    options: ["Mars", "Earth", "Venus", "Jupiter"],
    correct: "B"
  }
];

let questionIndex = 0;

// BLUETOOTH CONNECT
window.connectESP32 = async function() {

  try {

    if (!navigator.bluetooth) {
      alert("Please use Android Chrome with Bluetooth enabled.");
      return;
    }

    device = await navigator.bluetooth.requestDevice({
      filters: [{
        name: "STUDENT_ENGAGEMENT"
      }],
      optionalServices: [SERVICE_UUID]
    });

    document.getElementById("bleStatus").innerText =
      "Connecting...";

    const server = await device.gatt.connect();

    const service =
      await server.getPrimaryService(SERVICE_UUID);

    characteristic =
      await service.getCharacteristic(CHARACTERISTIC_UUID);

    await characteristic.startNotifications();

    characteristic.addEventListener(
      "characteristicvaluechanged",
      receiveESP32
    );

    document.getElementById("bleStatus").innerText =
      "CONNECTED: " + device.name;

    device.addEventListener("gattserverdisconnected", () => {
      document.getElementById("bleStatus").innerText =
        "Bluetooth disconnected";
      characteristic = null;
    });

  }

  catch(error) {
    alert("Bluetooth error: " + error.message);
  }
};

// RECEIVE ESP32 MESSAGE
function receiveESP32(event) {

  const value = event.target.value;

  const message = new TextDecoder().decode(value).trim();

  console.log("ESP32:", message);

  if (message === "RECOVERY") {
    showQuiz();
  }

  else if (message === "RESULT:CORRECT") {
    document.getElementById("message").innerText =
      "CORRECT ANSWER! Well done!";
  }

  else if (message === "RESULT:WRONG") {
    document.getElementById("message").innerText =
      "WRONG ANSWER. Try again next time!";
  }

  else if (message.startsWith("SCORE:")) {
    score = Number(message.split(":")[1]);

    document.getElementById("score").innerText =
      "Score: " + score;

    updateEngagement();
  }

  else if (message.startsWith("QUIZCOUNT:")) {
    quizCount = Number(message.split(":")[1]);

    document.getElementById("quizCount").innerText =
      "Quiz count: " + quizCount;
  }

  else if (message.startsWith("ERROR:")) {
    document.getElementById("message").innerText =
      message;
  }
}

// SEND BLUETOOTH MESSAGE
function sendBLE(message) {

  if (!characteristic) return Promise.reject(
    new Error("Bluetooth not connected")
  );

  pendingWrite = pendingWrite.then(async () => {

    const data = new TextEncoder().encode(message);

    if (characteristic.properties.write) {
      await characteristic.writeValueWithResponse(data);
    }
    else {
      await characteristic.writeValueWithoutResponse(data);
    }

  });

  return pendingWrite;
}

// START CAMERA
window.startCamera = async function() {

  try {

    if (!characteristic) {
      alert("Connect ESP32 Bluetooth first.");
      return;
    }

    document.getElementById("direction").innerText =
      "Loading AI model...";

    if (!faceLandmarker) {

      const vision =
        await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/wasm"
        );

      faceLandmarker =
        await FaceLandmarker.createFromOptions(
          vision,
          {
            baseOptions: {
              modelAssetPath:
                "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
              delegate: "CPU"
            },
            runningMode: "VIDEO",
            numFaces: 1
          }
        );
    }

    cameraStream =
      await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "user",
          width: { ideal: 640 },
          height: { ideal: 480 }
        },
        audio: false
      });

    video.srcObject = cameraStream;

    await video.play();

    cameraRunning = true;

    lastVideoTime = -1;

    detectFace();

  }

  catch(error) {

    alert("Camera error: " + error.message);

  }
};

// FACE DETECTION
function detectFace() {

  if (!cameraRunning) return;

  if (video.readyState >= 2 &&
      video.currentTime !== lastVideoTime) {

    lastVideoTime = video.currentTime;

    const results =
      faceLandmarker.detectForVideo(
        video,
        performance.now()
      );

    if (results.faceLandmarks.length > 0) {

      const landmarks = results.faceLandmarks[0];

      const nose = landmarks[1];
      const leftEye = landmarks[33];
      const rightEye = landmarks[263];

      const eyeCenter =
        (leftEye.x + rightEye.x) / 2;

      const eyeWidth =
        Math.abs(rightEye.x - leftEye.x);

      const diff =
        (nose.x - eyeCenter) / eyeWidth;

      let direction = "FORWARD";

      // Front camera: direction labels are
      // based on the student's head turn.
      if (diff > 0.18) {
        direction = "LEFT";
      }
      else if (diff < -0.18) {
        direction = "RIGHT";
      }

      document.getElementById("direction").innerText =
        "Direction: " + direction;

      sendDirection(direction);

    }

    else {

      document.getElementById("direction").innerText =
        "Direction: NO FACE";

      sendDirection("NO_FACE");

    }
  }

  requestAnimationFrame(detectFace);
}

// SEND DIRECTION
function sendDirection(direction) {

  const now = Date.now();

  if (direction === lastSentDirection &&
      now - lastSendTime < 1000) return;

  if (now - lastSendTime < 250) return;

  lastSentDirection = direction;
  lastSendTime = now;

  sendBLE(direction).catch(error => {
    console.log("BLE send error:", error);
  });
}

// STOP CAMERA
window.stopCamera = function() {

  cameraRunning = false;

  if (cameraStream) {
    cameraStream.getTracks().forEach(track => track.stop());
    cameraStream = null;
  }

  video.srcObject = null;

  document.getElementById("direction").innerText =
    "Camera stopped";

  sendDirection("NO_FACE");
};

// SHOW QUIZ
function showQuiz() {

  if (quizActive) return;

  quizActive = true;
  selectedAnswer = "";

  questionIndex =
    (questionIndex + 1) % questions.length;

  const q = questions[questionIndex];

  document.getElementById("quizBox").style.display =
    "block";

  document.getElementById("questionNumber").innerText =
    "Question " + (questionIndex + 1);

  document.getElementById("question").innerText =
    q.question;

  const buttons =
    document.querySelectorAll(".answer");

  buttons.forEach((button, index) => {

    button.classList.remove("selected");

    button.innerText =
      String.fromCharCode(65 + index) +
      ". " + q.options[index];

  });

  document.getElementById("message").innerText =
    "Choose your answer";

  document.getElementById("quizBox").scrollIntoView({
    behavior: "smooth"
  });
}

// SELECT ANSWER
window.selectAnswer = function(answer) {

  if (!quizActive) return;

  selectedAnswer = answer;

  document.querySelectorAll(".answer").forEach(button => {
    button.classList.remove("selected");
  });

  document.querySelectorAll(".answer")[
    answer.charCodeAt(0) - 65
  ].classList.add("selected");

  document.getElementById("message").innerText =
    "Selected answer: " + answer;
};

// SUBMIT ANSWER
window.submitAnswer = async function() {

  if (!quizActive) return;

  if (!selectedAnswer) {
    alert("Please select an answer.");
    return;
  }

  const q = questions[questionIndex];

  if (selectedAnswer !== q.correct) {
    document.getElementById("message").innerText =
      "Check your answer and submit again.";
    return;
  }

  try {

    await sendBLE("ANSWER:" + selectedAnswer);

    quizActive = false;

    document.getElementById("message").innerText =
      "Answer sent to ESP32. Checking...";

    document.getElementById("quizBox").style.display =
      "none";

  }

  catch(error) {

    document.getElementById("message").innerText =
      "Could not send answer. Reconnect Bluetooth.";

  }
};

// UPDATE STATUS
function updateEngagement() {

  let status = "LOW";

  if (score >= 70) status = "GOOD";
  else if (score >= 40) status = "MODERATE";

  document.getElementById("engagement").innerText =
    "Status: " + status;
}

// INITIAL DISPLAY
updateEngagement();

</script>

</body>
</html>
